<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form name="contacto" id="contacto">
        <fieldset>
            <legend>Formulario de contacto</legend>
<br>
        <label>Nombre: </label>
        <input type="text"
        required
        id="nombre" 
        placeholder="Ingrese su nombre">
<br><br>
        <label>Rut: </label>
        <input type="text"
        required
        id="rut"
        placeholder="Formato 12345678-9">
<br><br>
            <label>Correo electronico: </label> 
            <input type="email" id="email" required>
<br><br>    
            <label>Telefono: </label>
            <input type="tel" id="fono"> 
<br><br>
            <label>Fecha de nacimiento: </label>  
            <input type="date" id="fenac"> 
<br><br>
            <label>Seleccione productos</label>
            <select id="productos">
                    <option value="prod 1">Juguete 1</option>
                    <option value="prod 2">Juguete 2</option>
                    <option value="prod 3">Juguete 3</option>
                    <option value="prod 4">Juguete 4</option>
            </select> 
<br><br>
            <label>Cantidad</label> 
            <input type="number" min="10" max="99">
<br><br>
            <label>Forma de pago: </label>
            <label>Debito:  </label>  
            <input type="radio" name="fdepago" id="debito">
            <label>Credito: </label> 
            <input type="radio" name="fdepago" id="credito">
            <label>Efectivo: </label>                                                                
            <input type="radio" name="fdepago" id="efectivo"> 
<br><br>                                                                           
            <button type="submit">Comprar</button>
        <br>                                                        

        </fieldset>
    </form>
</body>
</html>
